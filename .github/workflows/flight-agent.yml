name: Daily flight prices

# Replaced by the Flight Deal Hunter (flight-deal-hunter.yml), so it only runs by hand now.
on:
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python flight_agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
